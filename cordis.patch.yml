# 多项目总控台（dsh-workbench-project-console）
# 把服务端入口插入 Harness 插件树；数据目录放在 DSH 数据目录下，卸载工作台不会删除它。
#
# 项目结构从 GitHub 读（可选）：
#   令牌放在 <root>/github-token（600 权限）。存在且 githubOwner 已配置时，
#   工作台展示的是 GitHub 上的「项目组 → 任务」原生层级，而不是本地 state.json 的台账。
#   没有令牌时行为与原来完全一致（本地台账 + 示例数据）。
- insert:
    - id: project-console
      name: dsh-workbench-project-console
      config:
        root: !!js dshHomePath('project-console')
        githubOwner: laiyinyizao007
        githubProjectNumber: 1
        # 台账（只读）：全部 GitHub 仓 + 归属分类 + 标签 + 状态。
        # 看板只放得下能建 Issue 的仓；归档仓和关了 Issues 的仓建不了条目，
        # 它们在「台账」页签里。文件由 my-project-management/export_repo_ledger.py 生成。
        ledgerPath: /home/averypi/Projects/my-project-management/repo-ledger.json
